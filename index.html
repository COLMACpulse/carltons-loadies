
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carlton's Loadies — BAGIFY v11</title>
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0a0a0a;
  color:#fff;
}
.container {
  padding:20px;
}
h1 {
  font-size:28px;
}
.video-wrap {
  position:relative;
  max-width:500px;
}
video, canvas {
  width:100%;
  border-radius:12px;
}
.controls {
  margin-top:12px;
  display:flex;
  gap:10px;
}
button {
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#ff7a3c;
  color:#000;
  font-weight:bold;
}
.secondary {
  background:#222;
  color:#fff;
}
</style>
</head>
<body>
<div class="container">
  <h1>CAMERA BAGIFY</h1>
  <p>See yourself with the bag. Capture it.</p>

  <div class="video-wrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="controls">
    <button id="capture">CAPTURE</button>
    <button id="flip" class="secondary">FLIP</button>
  </div>

  <canvas id="snapshot" style="margin-top:20px;"></canvas>
</div>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('overlay');
let ctx = canvas.getContext('2d');
let snapshot = document.getElementById('snapshot');
let snapCtx = snapshot.getContext('2d');

let facingMode = "user";
let stream;

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });
  video.srcObject = stream;
}

function draw() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // SIMPLE CENTERED BAG (placeholder for real face tracking)
  let w = canvas.width;
  let h = canvas.height;

  let bagWidth = w * 0.5;
  let bagHeight = h * 0.6;

  let x = (w - bagWidth)/2;
  let y = (h - bagHeight)/2;

  // BAG BODY
  ctx.fillStyle = "#c49a6c";
  ctx.fillRect(x, y, bagWidth, bagHeight);

  // EYE HOLES
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x + bagWidth*0.3, y + bagHeight*0.35, 10, 0, Math.PI*2);
  ctx.arc(x + bagWidth*0.7, y + bagHeight*0.35, 10, 0, Math.PI*2);
  ctx.fill();

  requestAnimationFrame(draw);
}

document.getElementById('capture').onclick = () => {
  snapshot.width = canvas.width;
  snapshot.height = canvas.height;
  snapCtx.drawImage(video,0,0);
  snapCtx.drawImage(canvas,0,0);
};

document.getElementById('flip').onclick = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  await startCamera();
};

video.addEventListener('play', () => {
  draw();
});

startCamera();
</script>
</body>
</html>
