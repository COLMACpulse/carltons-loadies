<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Joke Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Joke Market</h1>
    <p>Stick to funny. We handle the splits.</p>
  </header>

  <main>
    <section id="submit">
      <h2>Drop a Joke</h2>
      <input id="author" placeholder="Your name or alias" />
      <textarea id="jokeText" placeholder="Your joke goes here..."></textarea>
      <button id="postBtn">Post Joke</button>
    </section>

    <section id="feed">
      <h2>The Market</h2>
      <div id="jokeFeed"></div>
    </section>
  </main>

  <footer>
    <p>Laugh → Credit → Repeat</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
